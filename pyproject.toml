[build-system]
# 1.27 is the first hatchling that reads an SPDX `license` string (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graft-ipa"
version = "2.1"
description = "Inject tweaks and install IPAs on iPhone and iPad: into LiveContainer with a free Apple ID, or signed with a paid Apple Developer account."
readme = "README.md"
requires-python = ">=3.11"
# Graft's own code is MIT. It depends on pymobiledevice3, which is
# GPL-3.0-or-later; pip installs that separately, so this package stays MIT.
# A bundled or frozen CLI (PyInstaller, py2app, a zipapp with dependencies
# vendored, etc.) would include pymobiledevice3 and would have to be
# distributed under the GPL.
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "GreenglassT", email = "73795969+GreenglassT@users.noreply.github.com" },
]
keywords = ["ios", "ipa", "ipa-signer", "tweak", "sideload", "livecontainer", "cyan", "zsign"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "rich>=13.7",
    "typer>=0.12",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    # Every device call awaits pymobiledevice3 (`await create_using_usbmux`,
    # `await list_devices()`, `HouseArrestService.create`), and that API is
    # async only from 8.0.0; under 7.x the first `await` is a TypeError. And
    # before 9.36.2 `services.afc` (which installation_proxy and house_arrest
    # import) fails to import against construct-typing 0.8, which pip
    # resolves on a fresh install. 10.4.0 is the oldest release checked
    # against what installs now use (AFC `fopen`/`fwrite`/`fread`/`listdir`/
    # `rm_single`/`aclose`, `InstallationProxyService.send_package`,
    # `create_using_usbmux(serial=)`) and against the test suite's no-phone
    # guard, which needs `USBMUXD_SOCKET_ADDRESS` honoured at the socket
    # layer. The test suite passes at 10.4.0 and 11.61.0. AFC `fseek` came
    # after 10.4.0 (11.58.0 has it), so the LiveContainer tail read uses it
    # only where it exists and otherwise reads forward
    # (`lc_runner._read_end`); tests/test_dependency_caps.py fails on any AFC
    # call 10.4.0 lacks.
    #
    # Capped below the next major: it shipped four in 2026 (8.0 to 11.0), and
    # a 12.0 that renamed `fopen`/`fwrite` or changed `send_package` would
    # break every sideload and LiveContainer install on a fresh pipx install
    # while this suite, which fakes pymobiledevice3, stayed green. Raise the
    # cap after running the suite against the new major.
    "pymobiledevice3>=10.4.0,<12",
    # No frida: Graft's few frida questions (is the app running, what's on
    # screen, launch it) are asked of frida-ios-dump's own virtualenv, which
    # has frida 16 for its dump.py (graft_ipa/frida_probe.py). Graft.app would
    # otherwise ship frida's native module, which statically links LGPL code.
    # SSH, for the decrypt path. frida-ios-dump pulls the app bundle over it and
    # bagbak 4.x does too, but both reach it through their own interpreters — so
    # without this the CLI could *use* SSH and not *check* it, and the readiness
    # probe reported "no SSH server answered" for a phone whose SSH was fine.
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    # scripts/wikigen builds docs/wiki into the site.
    "markdown-it-py>=3.0",
    # scripts/lock-bundle: pip-compile writes bundle/requirements.lock.
    "pip-tools>=7.4",
]

[project.scripts]
graft = "graft_ipa.cli:app"

[project.urls]
Homepage = "https://github.com/GreenglassT/Graft"
Issues = "https://github.com/GreenglassT/Graft/issues"

[tool.hatch.build.targets.wheel]
packages = ["graft_ipa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer's whole API is `param: T = typer.Option(...)` in the signature — the
# call in the default *is* the declaration, evaluated once at import by design.
# B008 only catches the handful whose annotation ruff can't prove immutable
# (`list[str]`, `Path | None`), so without this it fires on an arbitrary 3 of
# the ~60 identical declarations in `main()`. Exempting the two constructors
# keeps B008 live for every other call-in-default.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
