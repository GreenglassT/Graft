# The crates.io crates compiled into ipatool's embedded 1Password SDK core:
# github.com/1password/onepassword-sdk-go v0.4.1-beta.1 carries it prebuilt,
# as internal/wasm/core.wasm (in pinned/ipatool/vendor.tar.gz), a
# WebAssembly module. 1Password builds it from its own source, which it
# doesn't publish, so there is no Cargo.lock: this is every crate the core
# itself shows it holds, read out of the built Helpers/bin/ipatool, and
# `seen` says how (delta audit #1):
#
# - "path" (the default): its crates.io source path,
#   .../registry/src/<index>/<crate>-<version>/, which a crate whose code can
#   panic leaves. The name and the version are the binary's.
# - "bindgen": wasm-bindgen, whose version its custom section records.
# - "name": only the core's other names show it: the crate at the root of a
#   Rust path in its `name` section's function names, or a crate whose
#   wasm-bindgen program is in its `__wasm_bindgen_unstable` section. The
#   binary carries no version for these, so `version` is the one
#   `cargo update` would have locked on 2026-01-24 (the newest "path"
#   crate's release, so the core's lock is at least that new): the newest
#   release by then that every requirement of the crates above allows, and
#   whose own requirements their versions meet. That rule gives the
#   binary's own version for 60 of the 69 "path" crates; the 9 it misses
#   are each required only by 1Password's own code, where it picks the
#   newest major. Of the "name" crates, nothing else in the core requires
#   futures-lite, reqwest, serde-wasm-bindgen or urlencoding, and their own
#   requirements allow more than one major, so theirs is the newest (a
#   guess: reqwest could be 0.12, futures-lite or urlencoding 1). The rest
#   are tied to one major by what requires them, or by their own
#   requirements (aes-gcm by aead 0.5, ed25519-dalek by curve25519-dalek 4).
#
# `lib` is a crate's library name where it isn't its name with `-` as `_`
# (md-5's is md5): how its code's paths spell it. 1Password's own crates
# (`own-prefix`, op-*, from its own git) come with the SDK's MIT license
# (ipatool-modules/), and Rust's standard library and what it vendors
# (/rust/deps/) aren't crates.io crates. A crate whose code left no source
# path, no function and no wasm-bindgen program in the core can't be seen.
#
# scripts/graft_bundle.py reads the crates out of the built ipatool and
# refuses one it shows that isn't listed here, or one listed that it
# doesn't show the way `seen` says; then it fetches each crate, checked
# against `checksum` (crates.io's SHA-256, its index's `cksum`), for its
# license files. `license` is the crate's Cargo.toml's; `license-file`, under
# bundle/licenses/, is the text for a crate that ships none (extism-convert
# and extism-manifest, BSD-3-Clause, from their repository). A crate under a
# copyleft license with no permissive choice (nom-supreme, MPL-2.0) goes
# into the source archive whole. verify-bundle checks the built app the same
# way: a notice for each crate the binary shows, at the version above.
#
# A new ipatool pin can change the core: list its crates again.

own-prefix = "op_"

